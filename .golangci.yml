# Lint configuration for the root module. The test module has its own, because
# it holds the oracles and the corpus tools that the root module never imports.
#
# # The rule for adding to this file
#
# A linter that makes idiomatic Go worse is disabled here, with the reason
# written beside it. Only a real defect gets a code change. A change made to
# quiet a linter, rather than to fix something, is itself the defect. dbmeta
# learned this first, and its configuration is the model for this one.
#
# # The posture
#
# `default: all`, with a disable list, which is the house style of the xo
# repositories. A new linter that a release adds gets a look rather than
# silence. The version in CI is pinned, so an upgrade cannot break a build
# that changed nothing.
version: "2"

run:
  modules-download-mode: readonly

linters:
  default: all
  disable:
    # A sentinel error is a constant of the type Error here (D24), which
    # err113 does not know how to check.
    - err113
    # wrapcheck wants every error from another package wrapped again, which
    # adds nothing where the caller already wraps it with context.
    - wrapcheck
    # A compiled regular expression or a fixed table at the package level is
    # data, not configuration. The rule that configuration belongs to the
    # caller (AGENTS.md, hard rule 9) is held by review.
    - gochecknoglobals
    # Style opinions that argue with gofmt or with plain code.
    - nlreturn
    - varnamelen
    - exhaustruct
    - exhaustruct_v5
    - mnd
    - nilnil
    - ireturn
    - nonamedreturns
    - wsl
    - wsl_v5
    - lll
    # prealloc rewrites readable loops for a gain nothing has measured.
    - prealloc
    # Complexity metrics. A function that walks a large spec is long by
    # nature, and these count it as complex.
    - cyclop
    - funlen
    - gocognit
    - gocyclo
    - maintidx
    - nestif
    # The tests of the documents are in package zuzu_test, and a test of an
    # unexported part is in the package it tests. Both are deliberate.
    - testpackage
    # noinlineerr bans `if err := f(); err != nil`, which is the form the Go
    # standard library uses.
    - noinlineerr
    # exhaustive wants an empty case for each value that a switch answers
    # after the switch, which says less than the code already does.
    - exhaustive
    # A type that decodes itself takes a pointer, and the same type encodes
    # itself as a value, as encoding/json/v2 expects. recvcheck reports the
    # mix, which is the pattern and not a defect.
    - recvcheck
    # depguard and gomodguard hold a list of allowed imports, and D5 allows
    # any import.
    - depguard
    - gomodguard
    - gomodguard_v2
    # The documents of this repository use American spelling, which misspell
    # holds, and dupword reads a test fixture of prose as a typo.
    - dupword
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^context\.(Background|TODO)$
          msg: take the context from the caller, never make one here
    # A file that was only read returns an error from Close that nothing can
    # act on.
    # An operator of the expression language, such as ===, reads best as
    # itself in the tables and the switches of the lexer and the evaluator.
    goconst:
      ignore-string-values:
        - '^[-+*/%<>=!&|^~?:]+$'
        # A name of the grammar of Vega, such as left, linear or utc, reads
        # best as itself, as the spec writes it.
        - '^[a-z][a-zA-Z0-9-]*$'
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (io.ReadCloser).Close
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    revive:
      rules:
        - name: context-as-argument
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: exported
        - name: indent-error-flow
        - name: package-comments
        - name: receiver-naming
        - name: var-naming
  exclusions:
    rules:
      # A test builds its own values and does not answer to the context rule.
      - path: _test\.go
        linters:
          - dupl
          - forbidigo
          - gosec
          # a test names the same file or value in several messages, where a
          # constant hides what the message says
          - goconst

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/xo/zuzu
