# Tests zuzu on every push and pull request.
#
# The unit job lints, formats, vets, builds and tests the three modules. The
# root module, the test module and the module of ELK in elk/ each have a
# go.mod, so each is linted and tested from its own folder. The module of
# ELK is under the EPL-2.0 and holds the copy of elk-go (D39 part 13, D44).
#
# The conformance job runs vega.js and vega-lite.js over the corpus to write
# the references of D17, then checks that zuzu still matches them at the
# shares that the plan states for phases 3 and 4. It also checks that the direct
# renderer draws the corpus as okage draws its SVG (D11).
#
# The arm64 job tests the root module and the module of ELK on arm64, where the compiler of Go fuses
# a multiply and an add and the package math gives other bits than on amd64.
# zuzu gives the same bytes on one architecture (D41), so the golden test of a
# copy of docs/UPSTREAM.md, which holds the bytes of amd64, does not run there.
#
# The tinygo job builds the packages of zuzu with TinyGo for WebAssembly, which
# D29 makes a target. TinyGo builds a program, so it builds test/cmd/wasm,
# which imports them, and elk/internal/wasm, which imports the module of ELK.
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run useless, so cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: |
            go.sum
            test/go.sum

      - name: Install golangci-lint
        # Pinned. The configuration is `default: all`, so an unpinned upgrade
        # enables a new linter and fails a build that changed nothing. It is
        # built with go install, because a prebuilt release older than
        # v2.15.0 cannot read the export data of Go 1.27.3, as okage found.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Lint
        run: golangci-lint run ./...

      - name: Lint the test module
        working-directory: test
        run: golangci-lint run ./...

      - name: Lint the module of ELK
        # elk/.golangci.yml skips the copy of elk-go in elk/internal/elkgo.
        working-directory: elk
        run: golangci-lint run ./...

      - name: Check formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "these files are not formatted:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./... && (cd test && go vet ./...) && (cd elk && go vet ./...)

      - name: Build
        run: go build ./... && (cd test && go build ./...) && (cd elk && go build ./...)

      - name: Build without cgo
        # The module that a user imports uses no cgo (D5), and a consumer
        # builds it with CGO_ENABLED=0. That is checked rather than assumed.
        run: CGO_ENABLED=0 go build ./... && (cd elk && CGO_ENABLED=0 go build ./...)

      - name: Test
        run: go test -race -count=2 ./...

      - name: Test the test module
        working-directory: test
        run: go test -race -count=1 ./...

      - name: Test the module of ELK
        working-directory: elk
        run: go test -race -count=1 ./...

  arm64:
    name: Unit on arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test
        run: go test -count=1 ./...

      - name: Test the module of ELK
        working-directory: elk
        run: go test -count=1 ./...

  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: test/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install cairo and pango
        # The npm package canvas builds against them, as its README says.
        # vega.js draws a heatmap, a label and a word cloud on its canvas,
        # and measures text with it (D59).
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install the oracle
        # vega, vega-lite and canvas are pinned in test/oracle/package.json.
        # canvas builds against the cairo of the runner, as on the machine
        # of a maintainer, not from a build that it downloads.
        working-directory: test/oracle
        env:
          npm_config_build_from_source: "true"
        run: npm install --no-audit --no-fund

      - name: Write the references
        working-directory: test
        run: TZ=UTC node oracle/oracle.mjs testdata

      - name: Compare zuzu with the references
        working-directory: test
        run: go run ./cmd/conform && go run ./cmd/conform -vl && go test -count=1 -run 'TestPhase[34]Share' ./conform

      - name: Compare the direct renderer with okage
        working-directory: test
        run: go test -count=1 ./raster

  tinygo:
    name: TinyGo
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up TinyGo
        # Pinned to the release that was tested on 2026-11-10 (D29).
        uses: acifani/setup-tinygo@v3
        with:
          tinygo-version: 0.44.0

      - name: Build for WebAssembly
        working-directory: test
        run: GOOS=wasip1 GOARCH=wasm tinygo build -o zuzu.wasm ./cmd/wasm

      - name: Build the module of ELK for WebAssembly
        working-directory: elk
        run: GOOS=wasip1 GOARCH=wasm tinygo build -o elk.wasm ./internal/wasm
