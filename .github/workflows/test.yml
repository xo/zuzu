# Tests zuzu on every push and pull request.
#
# The unit job lints, formats, vets, builds and tests both modules. The root
# module and the test module each have a go.mod, so each is linted and tested
# from its own folder.
#
# The conformance job runs vega.js and vega-lite.js over the corpus to write
# the references of D17, then checks that zuzu still matches them at the
# share that the plan states for phase 3.
#
# The tinygo job builds the packages of zuzu with TinyGo for WebAssembly, which
# D29 makes a target. TinyGo builds a program, so it builds test/cmd/wasm,
# which imports them.
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run useless, so cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: |
            go.sum
            test/go.sum

      - name: Install golangci-lint
        # Pinned. The configuration is `default: all`, so an unpinned upgrade
        # enables a new linter and fails a build that changed nothing. It is
        # built with go install, because a prebuilt release older than
        # v2.15.0 cannot read the export data of Go 1.27.3, as okage found.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Lint
        run: golangci-lint run ./...

      - name: Lint the test module
        working-directory: test
        run: golangci-lint run ./...

      - name: Check formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "these files are not formatted:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./... && (cd test && go vet ./...)

      - name: Build
        run: go build ./... && (cd test && go build ./...)

      - name: Build without cgo
        # The module that a user imports uses no cgo (D5), and a consumer
        # builds it with CGO_ENABLED=0. That is checked rather than assumed.
        run: CGO_ENABLED=0 go build ./...

      - name: Test
        run: go test -race -count=2 ./...

      - name: Test the test module
        working-directory: test
        run: go test -race -count=1 ./...

  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: test/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install the oracle
        # vega and vega-lite are pinned in test/oracle/package.json.
        working-directory: test/oracle
        run: npm install --no-audit --no-fund

      - name: Write the references
        working-directory: test
        run: TZ=UTC node oracle/oracle.mjs testdata

      - name: Compare zuzu with the references
        working-directory: test
        run: go run ./cmd/conform && go run ./cmd/conform -vl && go test -count=1 -run 'TestPhase[34]Share' ./conform

  tinygo:
    name: TinyGo
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up TinyGo
        # Pinned to the release that was tested on 2026-11-10 (D29).
        uses: acifani/setup-tinygo@v3
        with:
          tinygo-version: 0.44.0

      - name: Build for WebAssembly
        working-directory: test
        run: GOOS=wasip1 GOARCH=wasm tinygo build -o zuzu.wasm ./cmd/wasm
